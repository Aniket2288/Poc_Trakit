# Settings every app container shares (api, worker, beat). Values are read from .env on the host.
x-app-env: &app-env
  DATABASE_HOST: db
  DATABASE_PORT: 5432
  DATABASE_USER: ${POSTGRES_USER}
  DATABASE_PASSWORD: ${POSTGRES_PASSWORD}
  DATABASE_NAME: ${POSTGRES_DB}
  REDIS_URL: redis://redis:6379/0
  EMAIL_BACKEND: smtp
  SMTP_HOST: mailhog
  SMTP_PORT: 1025
  UPLOAD_DIR: /code/uploads

services:
  db:
    image: postgres:16
    env_file: .env
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Catches every email the app sends. Open http://localhost:8025 to read them.
  mailhog:
    image: mailhog/mailhog
    ports:
      - "8025:8025"

  api:
    build: .
    # Bring the schema up to date before serving; a failed migration stops the API from starting.
    command: sh -c "alembic upgrade head && uvicorn app.main:app --host 0.0.0.0 --port 8000 --proxy-headers"
    env_file: .env
    environment: *app-env
    ports:
      - "8000:8000"
    volumes:
      - uploads:/code/uploads
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # Runs the background jobs (assignment emails, the digest).
  worker:
    build: .
    command: celery -A app.worker.celery_app worker --loglevel=INFO
    env_file: .env
    environment: *app-env
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  # The clock: puts the daily digest job on the queue at 09:00. Run exactly one of these.
  beat:
    build: .
    command: celery -A app.worker.celery_app beat --loglevel=INFO --schedule /tmp/celerybeat-schedule
    env_file: .env
    environment: *app-env
    depends_on:
      redis:
        condition: service_healthy

volumes:
  pgdata:
  uploads:
